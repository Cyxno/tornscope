# TornScope production compose — PREBUILT IMAGES (default install path).
#
# App services pull ready-made images from GHCR; only Docker is required, no
# Node/pnpm toolchain. PostgreSQL and Redis intentionally stay official
# upstream images — TornScope does not publish its own.
#
#   Version pinning (recommended): TORNSCOPE_VERSION=1.0.3 in .env
#   `latest` tracks the current stable release.
#
# Build TornScope from SOURCE instead (developers / contributors):
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
# The override file restores the local build definitions (same Dockerfiles the
# published images are built from); runtime configuration below is identical
# for both paths, so this file stays the single source of runtime truth.
#
# The Cyxno production server does NOT use this file: scripts/deploy-prod.sh
# deploys docker-compose.unraid.yml (local builds + hardened build-identity
# verification) and is unaffected by this file.

name: tornscope

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tornscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tornscope}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tornscope} -d ${POSTGRES_DB:-tornscope}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Database is bound to localhost only; historical data may be unrecoverable
    # from Torn later, so treat this volume as precious and back it up.
    ports:
      # Host port overridable (smoke runs on a shared host map a free port);
      # inside the compose network it is always 5432.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot migration runner. Reuses the published API image (same
  # filesystem as the api.Dockerfile "migrator" stage it was built from), so
  # no fourth package is needed; the entrypoint/working_dir override reproduces
  # the migrator stage's exact command.
  migrate:
    image: ${TORNSCOPE_REGISTRY:-ghcr.io/cyxno}/tornscope-api:${TORNSCOPE_VERSION:-latest}
    working_dir: /app/packages/database
    entrypoint: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tornscope}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-tornscope}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${TORNSCOPE_REGISTRY:-ghcr.io/cyxno}/tornscope-api:${TORNSCOPE_VERSION:-latest}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-tornscope}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-tornscope}?schema=public
      REDIS_URL: redis://redis:6379
      TORN_API_BASE_URL: ${TORN_API_BASE_URL:-https://api.torn.com/v2}
      TORN_API_MIN_REQUEST_INTERVAL_MS: ${TORN_API_MIN_REQUEST_INTERVAL_MS:-700}
      API_KEY_ENCRYPTION_KEY: ${API_KEY_ENCRYPTION_KEY:?set API_KEY_ENCRYPTION_KEY in .env}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      ENV_LABEL: ${ENV_LABEL:-}
      # Browser-facing origin (localhost default keeps local dev easy; a
      # non-local deployment MUST configure the real origin — see README
      # "Running TornScope outside localhost").
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # Trust X-Forwarded-* headers behind a reverse proxy (false only for
      # direct unproxied exposure).
      TRUST_PROXY: ${TRUST_PROXY:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    image: ${TORNSCOPE_REGISTRY:-ghcr.io/cyxno}/tornscope-worker:${TORNSCOPE_VERSION:-latest}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-tornscope}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-tornscope}?schema=public
      REDIS_URL: redis://redis:6379
      TORN_API_BASE_URL: ${TORN_API_BASE_URL:-https://api.torn.com/v2}
      TORN_API_MIN_REQUEST_INTERVAL_MS: ${TORN_API_MIN_REQUEST_INTERVAL_MS:-700}
      API_KEY_ENCRYPTION_KEY: ${API_KEY_ENCRYPTION_KEY:?set API_KEY_ENCRYPTION_KEY in .env}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      ENV_LABEL: ${ENV_LABEL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    image: ${TORNSCOPE_REGISTRY:-ghcr.io/cyxno}/tornscope-web:${TORNSCOPE_VERSION:-latest}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    environment:
      NODE_ENV: production
      PORT: 5173
      API_BASE_URL: http://api:3000
      # Browser-facing origin; MUST match what users open in their browser.
      # Falls back to APP_BASE_URL for older single-variable .env files.
      ORIGIN: ${ORIGIN:-${APP_BASE_URL:-http://localhost:5173}}
      # Real client-IP resolution for the API's per-IP rate limits. Unset =
      # socket address (localhost/direct access). Behind a reverse proxy set
      # CLIENT_IP_HEADER=x-forwarded-for (+ CLIENT_IP_DEPTH) or
      # cf-connecting-ip — see README.
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
      CLIENT_IP_DEPTH: ${CLIENT_IP_DEPTH:-1}
      # Visible UI environment chip. Keep empty in production (shows "Production");
      # dev/staging set e.g. "Development" so staging cannot pose as production.
      PUBLIC_ENV_LABEL: ${PUBLIC_ENV_LABEL:-}
    ports:
      # Host port overridable so a smoke run can coexist with a real
      # deployment on the same host (never touches other compose projects).
      - "127.0.0.1:${WEB_HOST_PORT:-5173}:5173"
    depends_on:
      - api

volumes:
  postgres-data:
