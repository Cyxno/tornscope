name: CI
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tornscope
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: tornscope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
    env:
      POSTGRES_PASSWORD: ci-test-password
      TEST_DATABASE_URL: postgresql://tornscope:ci-test-password@localhost:5432/tornscope_test
      DATABASE_URL: postgresql://tornscope:ci-test-password@localhost:5432/tornscope_test
      REDIS_URL: redis://127.0.0.1:6379/15
      API_KEY_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      TORN_API_MIN_REQUEST_INTERVAL_MS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # Must match the root package.json "packageManager" pin exactly —
          # enforced by scripts/version-check.mjs (preflight + local).
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm db:generate
      - name: Apply migrations to test database
        run: |
          pnpm exec prisma migrate deploy --schema packages/database/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://tornscope:ci-test-password@localhost:5432/tornscope_test
      - name: Build internal packages needed by seed
        # The seed imports the @tornscope/database barrel, whose module
        # graph reaches the other internal packages (@tornscope/shared,
        # @tornscope/torn-api and @tornscope/analytics via the
        # intelligence-facts re-export). A clean checkout has NO dist
        # output, so building only some of them left @tornscope/analytics
        # unresolved and the seed failed with ERR_MODULE_NOT_FOUND — which
        # is why main CI was red while local verify (pre-built dist) was
        # green. Build every internal package; pnpm orders them
        # topologically by their workspace dependencies.
        run: pnpm --filter './packages/**' build

      - name: Seed demo data (required by some DB-backed tests)
        run: |
          pnpm exec tsx packages/database/src/seed/demo.ts
        env:
          DATABASE_URL: postgresql://tornscope:ci-test-password@localhost:5432/tornscope_test
          API_KEY_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: SvelteKit sync (generates .svelte-kit/tsconfig.json)
        run: pnpm --filter @tornscope/web exec svelte-kit sync

      - name: Svelte check
        run: pnpm --filter @tornscope/web exec svelte-check --tsconfig ./tsconfig.json
      - name: Route integrity (nav hrefs ↔ tracked routes, gitignore audit)
        run: node scripts/ci/route-integrity.mjs
      - name: Test (with DB-backed suites)
        run: pnpm test
      - name: Assert DB-backed suites actually ran
        run: |
          # Re-run a known DB-backed suite and assert it was NOT skipped
          RESULT=$(pnpm vitest run apps/api/tests/privacy-rehab-regressions.test.ts 2>&1)
          if echo "$RESULT" | grep -q "skipped"; then
            echo "ERROR: DB-backed tests were skipped — TEST_DATABASE_URL is not effective"
            exit 1
          fi
          if echo "$RESULT" | grep -qE "[0-9]+ passed"; then
            echo "DB-backed tests ran successfully"
          else
            echo "ERROR: DB-backed tests did not pass"
            exit 1
          fi
      - name: Build
        run: pnpm build
      - name: Docker compose config
        run: docker compose config --quiet
      - name: Docker compose config (dev stack)
        run: docker compose -f docker-compose.dev.yml config --quiet
      - name: Postgres storage-path policy (preflight regression)
        run: bash scripts/tests/test-preflight-postgres-path.sh

  # Docker is the recommended deployment path, so CI must prove the real
  # production images build and the full stack boots and becomes ready.
  # Runs in its own job (no host port conflicts with the verify job's
  # postgres/redis service containers) under an isolated Compose project.
  docker:
    runs-on: ubuntu-latest
    needs: verify
    env:
      POSTGRES_USER: tornscope
      POSTGRES_PASSWORD: ci-smoke-postgres-password
      POSTGRES_DB: tornscope
      API_KEY_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      GIT_SHA: ${{ github.sha }}
      COMPOSE_PROJECT_NAME: tornscope-smoke
      # CI exercises the SOURCE-BUILD path (base compose + build override) —
      # the same Dockerfiles the publish-images workflow ships to GHCR.
      COMPOSE_FILE: docker-compose.yml:docker-compose.build.yml
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose config with CI env
        run: docker compose config --quiet
      - name: Validate prebuilt compose config (base file alone)
        run: docker compose -f docker-compose.yml config --quiet
      - name: Build production images (api, worker, web)
        run: docker compose build
      - name: Smoke test (up → readiness → /api/ready)
        run: bash scripts/ci/docker-smoke-test.sh
        env:
          # Project name + ephemeral host ports are enforced by the script
          # itself (v2.6.1: hard-fails on any production-colliding name and
          # picks three free ports so a live deployment is never touched).
          SMOKE_TIMEOUT: 300
